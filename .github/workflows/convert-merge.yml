# After merge to main: dispatch convert for each touched recipes/<name>.
#
# A real workflow_dispatch (not a reusable `uses:`) so that every conversion
# shows up as its own convert run with its own environment approval history.
name: convert-merge

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'

permissions:
  contents: read
  actions: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.d.outputs.recipes }}
      any: ${{ steps.d.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: d
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            # New branch or first push: compare with the parent, or nothing at the root commit.
            BEFORE=$(git rev-parse -q --verify "$AFTER^" || echo "$AFTER")
          fi
          RECIPES=$(node scripts/list-touched-recipes.mjs --base "$BEFORE" --head "$AFTER" --json)
          echo "recipes=$RECIPES" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$RECIPES" != '[]' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "touched=$RECIPES"

  dispatch:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJson(needs.detect.outputs.recipes) }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch convert for ${{ matrix.recipe }}
        uses: actions/github-script@v9
        with:
          script: |
            const recipe = '${{ matrix.recipe }}';
            console.log(`dispatch convert.yml recipe=${recipe} ref=${context.ref}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'convert.yml',
              ref: context.ref,
              inputs: { recipe, publish: 'true' },
            });
